name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only HEAD^ HEAD | grep -E '\.(png|jpg|jpeg|gif|svg|webp)$' | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Purge jsDelivr cache
        if: steps.changed-files.outputs.files != ''
        run: |
          REPO="${{ github.repository }}"       # ex: ryvieos/Ryvie-Gallery
          BRANCH="${{ github.ref_name }}"       # ex: main

          count=0
          for file in ${{ steps.changed-files.outputs.files }}; do
            # Guillemets DOUBLES → les variables sont expansées.
            # Chemin = /gh/<owner>/<repo>@<branch>/<file> (REPO contient déjà owner/repo).
            url="https://purge.jsdelivr.net/gh/${REPO}@${BRANCH}/${file}"
            echo "Purge: $url"
            curl -sS "$url" -o /dev/null
            count=$((count + 1))
          done

          echo "Total fichiers purgés: $count"
